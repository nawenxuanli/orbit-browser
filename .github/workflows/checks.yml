name: Native macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check build script and app metadata
        run: |
          bash -n Source/build.sh
          plutil -lint Source/Info.plist
      - name: Build Apple silicon and Intel app
        run: bash Source/build.sh
      - name: Package development build
        run: ditto -c -k --norsrc --noextattr --keepParent Orbit.app Orbit-macOS-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-macOS-development
          path: Orbit-macOS-development.zip
          if-no-files-found: error
          retention-days: 14
