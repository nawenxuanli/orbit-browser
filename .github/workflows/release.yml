name: Build and publish Orbit

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x64
          - os: windows-latest
            label: Windows-x64
          - os: ubuntu-latest
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Expand the current source archive
        shell: bash
        run: |
          mkdir source
          SOURCE_ARCHIVE=$(find . -maxdepth 1 -name 'Orbit-source-*.zip' | sort | tail -n 1)
          test -n "$SOURCE_ARCHIVE"
          unzip -q "$SOURCE_ARCHIVE" -d source
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != ''
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          KEYCHAIN_PATH="$RUNNER_TEMP/orbit-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/orbit-signing.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: Prepare notarization key
        if: runner.os == 'macOS' && env.APPLE_API_KEY_BASE64 != ''
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/OrbitNotaryKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/OrbitNotaryKey.p8" >> "$GITHUB_ENV"
      - name: Build app package
        env:
          CSC_NAME: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run make
        working-directory: source
      - uses: actions/upload-artifact@v7
        with:
          name: Orbit-${{ matrix.label }}
          path: source/out/make/**/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Expand the current source archive
        run: |
          mkdir source
          SOURCE_ARCHIVE=$(find . -maxdepth 1 -name 'Orbit-source-*.zip' | sort | tail -n 1)
          test -n "$SOURCE_ARCHIVE"
          unzip -q "$SOURCE_ARCHIVE" -d source
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.zip
          prerelease: true
          body_path: source/RELEASE_NOTES.md
