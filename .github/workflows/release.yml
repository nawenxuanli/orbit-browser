name: Build and publish Orbit

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: ubuntu-latest
            label: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Expand the current source archive
        shell: bash
        run: |
          mkdir source
          SOURCE_ARCHIVE=$(find . -maxdepth 1 -name 'Orbit-source-*.zip' | sort | tail -n 1)
          test -n "$SOURCE_ARCHIVE"
          unzip -q "$SOURCE_ARCHIVE" -d source
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - name: Build app package
        run: npm run make
        working-directory: source
      - uses: actions/upload-artifact@v7
        with:
          name: Orbit-${{ matrix.label }}
          path: source/out/make/**/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Expand the current source archive
        run: |
          mkdir source
          SOURCE_ARCHIVE=$(find . -maxdepth 1 -name 'Orbit-source-*.zip' | sort | tail -n 1)
          test -n "$SOURCE_ARCHIVE"
          unzip -q "$SOURCE_ARCHIVE" -d source
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/**/*.zip
          prerelease: true
          body_path: source/RELEASE_NOTES.md
